# GitHub-Action fuer das oeffentliche Daten-Repo "stats-data" (Live-Layer des Statistik-Widgets).
# Legt in `.github/workflows/refresh-stats.yml` des Daten-Repos. Prueft die Weltbank-Kennzahlen
# taeglich und committet `wb-stats.json` NUR bei Aenderung; das Widget holt sie clientseitig
# (cache:"no-store") mit gebackenem Fallback — s. _assets/stats-github/README.md.
# Hinweis: WB-Werte sind Jahreswerte (aendern sich real ~1x/Jahr bzw. bei Revisionen); die taegliche
# Pruefung faengt Nachmeldungen/Revisionen frueher, kostet dank "commit only if changed" sonst nichts.
name: refresh-stats
on:
  schedule:
    - cron: "0 3 * * *"      # taeglich 03:00 UTC (committet nur bei echter Aenderung)
  workflow_dispatch: {}       # zusaetzlich manuell ausloesbar
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # stats-widget.py liegt (als Kopie) im Daten-Repo — s. README, Schritt 2.
      - name: Weltbank-Daten backen
        run: python stats-widget.py --emit-json wb-stats.json
      - name: Committen, falls geaendert
        run: |
          git config user.name  "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add wb-stats.json
          git diff --cached --quiet || git commit -m "auto: Weltbank-Statistik aktualisiert"
          git push
